name: quality check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Run build regression tests
        run: python -m unittest discover -s tests -v

      - name: Run browser search logic regressions
        run: node --test tests/*.test.cjs

      - name: Initialize the sample config
        run: python -c "import shutil; shutil.copyfile('site.config.example.json', 'site.config.json')"

      - name: Build the site from the template
        run: python scripts/build.py

      - name: Run the quality gate
        run: python scripts/quality_check.py

      - name: Audit output
        run: python scripts/check_artifacts.py

      - name: Verify reproducible builds
        run: python scripts/verify_build.py
