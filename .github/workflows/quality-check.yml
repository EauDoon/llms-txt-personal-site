name: quality check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Run build regression tests
        run: python -m unittest discover -s tests -v

      - name: Run browser search logic regressions
        run: node --test tests/*.test.cjs

      - name: Initialize the sample config
        run: python -c "import shutil; shutil.copyfile('site.config.example.json', 'site.config.json')"

      - name: Build the site from the template
        run: python scripts/build.py

      - name: Run the quality gate
        run: python scripts/quality_check.py

      - name: Audit output
        run: python scripts/check_artifacts.py

      - name: Verify reproducible builds
        run: python scripts/verify_build.py
