name: quality check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run build regression tests
        run: python -m unittest discover -s tests -v

      - name: Run browser search logic regressions
        run: node --test tests/*.test.cjs

      - name: Build the site from the template
        run: |
          cp site.config.example.json site.config.json
          python scripts/build.py

      - name: Run the quality gate
        run: python scripts/quality_check.py

      - name: Audit output and verify reproducible builds
        run: |
          python scripts/check_artifacts.py
          python scripts/verify_build.py
